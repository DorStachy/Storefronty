# Fly.io config for the Storefronty backend (Node API + portal SPA + pipeline).
# Deploy:  fly launch --no-deploy   (once, to create the app + volume)
#          fly volumes create sf_data --size 1
#          fly secrets set SIGN_SECRET=... GMAIL_USER=... GMAIL_APP_PASSWORD=... \
#                          GEMINI_API_KEY=... GOOGLE_PLACES_KEY=... SERPER_API_KEY=... \
#                          GOOGLE_CLIENT_ID=... GOOGLE_CLIENT_SECRET=... \
#                          CLOUDFLARE_ACCOUNT_ID=... CLOUDFLARE_API_TOKEN=... \
#                          CLOUDFLARE_KV_NAMESPACE_ID=... CLOUDFLARE_PREVIEW_HOST=https://storefronty-previews.<acct>.workers.dev
#          fly deploy
app = "storefronty"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  DB_PATH = "/data/storefronty.db"
  HOSTING_ENGINE = "cloudflare"    # 48h preview sites → Cloudflare KV (free)
  CHROMIUM_NO_SANDBOX = "1"        # Playwright Chromium inside the container
  TICK_INTERVAL_MS = "60000"       # advance the pipeline every 60s (in-process scheduler)
  POLL_INTERVAL_MS = "120000"      # read Gmail replies every 120s
  BRAND = "Storefronty"
  # Set these to the real URL after the first deploy (reply-email + claim links use them):
  PUBLIC_BASE_URL = "https://storefronty.fly.dev"
  PORTAL_BASE_URL = "https://storefronty.fly.dev"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"       # always-on so the scheduler keeps ticking + polling
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "sf_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1024mb"   # chromium (screenshotter/QA) needs headroom
